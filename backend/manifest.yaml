apiVersion: v1
kind: ConfigMap
metadata:
  name: backend
  namespace: expense
data:
  DB_HOST: mysql
  duration: "120hrs"
---
apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: expense
  labels:
    app: backend
    tier: api
    project: expense

spec:
  replicas: 2

  selector:
    matchLabels:
      app: backend
      tier: api
      project: expense

  template:
    metadata:
      labels:
        app: backend
        tier: api
        project: expense
    spec:
      containers:
      - name: backend
        image: kumarprashanth/backend:v1
        envFrom: 
        - configMapRef:
          name: backend
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: expense
spec:
  selector:
    app: backend
    tier: api
    project: expense
  ports:
  - name: backend-port
    protocol: TCP
    port: 8080 # this is service port
    targetPort: 8080 # this is container port
